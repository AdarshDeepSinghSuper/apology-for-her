<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8f4">
  <meta name="description" content="A little apology, made with love.">
  <title>A little something for you ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <div class="ambient ambient-one" aria-hidden="true"></div>
    <div class="ambient ambient-two" aria-hidden="true"></div>
    <article class="card" aria-live="polite">
      <div class="topline"><span class="tiny-heart" aria-hidden="true">♥</span><span>a little note for you</span><span class="tiny-heart" aria-hidden="true">♥</span></div>
      <div class="flower" aria-hidden="true"><span>✦</span><i>♡</i></div>
      <div class="step-label" id="step-label">a small question</div>
      <h1 id="question">Are you still<br><em>upset</em> with me?</h1>
      <p class="copy" id="copy">I’m sorry I upset you. You deserve honesty and care.<br>I’d like to talk whenever you’re ready.</p>
      <div class="buttons" id="buttons">
        <button class="btn btn-yes" id="yes-button" type="button">Yes, I’m still upset</button>
        <button class="btn btn-no" id="no-button" type="button" hidden>No, I’m ready to talk</button>
      </div>
      <p class="hint" id="hint">Be honest… I can take it (probably).</p>
      <div class="progress" aria-hidden="true"><span class="progress-dot active"></span><span class="progress-line"></span><span class="progress-dot"></span></div>
      <footer>made with a very sorry heart <span>♡</span></footer>
    </article>
  </main>
</body>
</html>
